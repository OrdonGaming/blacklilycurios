<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Thank you for contacting Black Lily Curios. Your request has been submitted successfully.">

    <title>Thank You | Black Lily Curios</title>

    <link rel="preload"
          href="images/black-lily-banner.png"
          as="image">

    <link rel="prefetch"
          href="index.html">

    <link rel="prefetch"
          href="contact.html">

    <script>
        document.documentElement.classList.add("js");
    </script>

    <style>
        :root {
            --background: #08080a;
            --panel: rgba(8, 7, 10, 0.9);
            --text: #f1ece5;
            --muted: #c4bbc1;
            --accent: #a58bac;
            --accent-light: #d8c5dd;
            --border: rgba(210, 194, 215, 0.42);
            --page-padding: clamp(0.75rem, 2vh, 2rem);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        html {
            scrollbar-gutter: stable;
            background-color: var(--background);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: var(--page-padding);

            display: grid;
            place-items: center;

            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;

            background-image:
                linear-gradient(
                    rgba(3, 3, 5, 0.58),
                    rgba(3, 3, 5, 0.84)
                ),
                url("images/black-lily-banner.png");

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--background);
        }

        .thank-you-card {
            width: min(820px, 100%);
            padding: clamp(1.5rem, 5vw, 3.5rem);

            text-align: center;

            background: var(--panel);
            border: 1px solid var(--border);

            outline: 1px solid rgba(255, 255, 255, 0.05);
            outline-offset: -10px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.82),
                inset 0 0 50px rgba(255, 255, 255, 0.02);

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }


        .banner-home-link {
            display: block;
            width: min(760px, 100%);
            margin: 0 auto 1.75rem;
            color: inherit;
            text-decoration: none;
            background: transparent;
            border: 0;
        }

        .banner-home-link .header-banner {
            width: 100%;
            margin: 0;
        }

        .banner-home-link:hover,
        .banner-home-link:active {
            color: inherit;
            background: transparent;
        }

        .banner-home-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .header-banner {
            display: block;
            width: min(700px, 100%);
            height: auto;
            margin: 0 auto 1.75rem;

            border: 1px solid var(--border);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.7),
                0 0 18px rgba(135, 89, 164, 0.12);
        }

        .divider {
            width: 130px;
            height: 1px;
            margin: 1.5rem auto;

            background: linear-gradient(
                to right,
                transparent,
                var(--accent),
                transparent
            );
        }

        h1 {
            margin: 0;

            color: var(--text);
            font-size: clamp(1.7rem, 5vw, 2.6rem);
            font-weight: normal;
            letter-spacing: 0.13em;
            text-transform: uppercase;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.95),
                0 0 12px rgba(0, 0, 0, 0.7);
        }

        .message {
            max-width: 620px;
            margin: 1rem auto 0;

            color: var(--muted);
            font-size: clamp(0.98rem, 2vw, 1.08rem);
            line-height: 1.75;
        }

        .accent-message {
            margin-top: 1rem;
            color: var(--accent-light);
            font-style: italic;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            display: inline-block;
            min-width: 190px;
            padding: 0.9rem 1.4rem;

            color: var(--text);
            text-align: center;
            text-decoration: none;
            letter-spacing: 0.09em;

            background-color: rgba(15, 13, 18, 0.78);
            border: 1px solid var(--border);

            transition:
                background-color 180ms ease,
                border-color 180ms ease,
                transform 180ms ease;
        }

        .button:hover,
        .button:focus-visible {
            background-color: rgba(165, 139, 172, 0.24);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        footer {
            margin-top: 2.25rem;

            color: #918991;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
        }

        html.js::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 9999;

            background: var(--background);
            opacity: 1;
            visibility: visible;
            pointer-events: none;

            transition:
                opacity 320ms ease,
                visibility 0s linear 0s;
        }

        html.js.page-ready::before {
            opacity: 0;
            visibility: hidden;

            transition:
                opacity 320ms ease,
                visibility 0s linear 320ms;
        }

        html.js.page-leaving::before {
            opacity: 1;
            visibility: visible;

            transition:
                opacity 220ms ease,
                visibility 0s linear 0s;
        }

        @media (max-width: 700px) {
            :root {
                --page-padding: 0.75rem;
            }

            body {
                background-attachment: scroll;
            }

            .thank-you-card {
                padding: 2rem 1.1rem;
            }

            .header-banner {
                width: 100%;
                margin-bottom: 1.4rem;
            }

            .actions {
                display: grid;
            }

            .button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }

        /* =========================================================
           Mobile optimization
           ========================================================= */
        @media (max-width: 700px) {
            body {
                padding:
                    max(0.75rem, env(safe-area-inset-top))
                    max(0.75rem, env(safe-area-inset-right))
                    max(0.75rem, env(safe-area-inset-bottom))
                    max(0.75rem, env(safe-area-inset-left));

                overflow-x: hidden;
                background-attachment: scroll;
            }

            .contact-card,
            .coming-soon,
            .thank-you-card {
                width: 100%;
                padding: 1.5rem 1rem;

                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);

                box-shadow:
                    0 12px 35px rgba(0, 0, 0, 0.75),
                    inset 0 0 30px rgba(255, 255, 255, 0.015);
            }

            .header-banner {
                width: 100%;
                height: auto;
                margin-bottom: 1.25rem;
            }

            .logo {
                max-width: min(340px, 88vw);
                height: auto;
            }

            input:not([type="radio"]):not([type="checkbox"]),
            select,
            textarea,
            button,
            .button,
            .return-link,
            .contact {
                min-height: 44px;
                font-size: 16px;
            }

            input[type="radio"],
            input[type="checkbox"] {
                flex: 0 0 auto;
            }

            .radio-option,
            .checkbox-option {
                min-height: 44px;
            }

            input[type="file"] {
                max-width: 100%;
                overflow: hidden;
            }

            .form-row,
            .contact-preferences {
                grid-template-columns: 1fr;
            }

            .contact-preferences fieldset {
                width: min(100%, 260px);
            }

            .actions {
                display: grid;
                width: 100%;
            }

            button,
            .button,
            .return-link,
            .contact {
                width: 100%;
            }

            p,
            label,
            legend,
            .help-text {
                overflow-wrap: anywhere;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.55rem;
                letter-spacing: 0.09em;
            }

            .intro,
            .description,
            .message {
                font-size: 0.98rem;
                line-height: 1.55;
            }

            .contact-card,
            .coming-soon,
            .thank-you-card {
                padding: 1.25rem 0.85rem;
            }

            .divider {
                margin-top: 1rem;
                margin-bottom: 1rem;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            button:hover,
            .button:hover,
            .return-link:hover,
            .contact:hover {
                transform: none;
            }
        }

    </style>
</head>

<body>
    <main class="thank-you-card">

        <a class="banner-home-link"
           href="index.html"
           aria-label="Return to the Black Lily Curios homepage">
            <img class="header-banner"
                 src="images/black-lily-banner.png"
                 alt="Black Lily Curios banner">
        </a>

        <div class="divider" aria-hidden="true"></div>

        <h1>Thank You</h1>

        <p class="message">
            Your message has been sent successfully. Black Lily Curios
            will review your request and respond using the contact
            information you provided.
        </p>

        <p class="message accent-message">
            Until then, may curiosity guide you.
        </p>

        <div class="actions">
            <a class="button"
               href="index.html">
                Return Home
            </a>

            <a class="button"
               href="contact.html">
                Send Another Request
            </a>
        </div>

        <footer>
            &copy; 2026 Black Lily Curios
        </footer>

    </main>

    <script>
        (function () {
            const root = document.documentElement;
            let navigationStarted = false;

            function revealPage() {
                root.classList.remove("page-leaving");

                requestAnimationFrame(function () {
                    root.classList.add("page-ready");
                });
            }

            if (document.readyState === "loading") {
                document.addEventListener(
                    "DOMContentLoaded",
                    revealPage,
                    { once: true }
                );
            } else {
                revealPage();
            }

            window.addEventListener("pageshow", revealPage);

            document.addEventListener("click", function (event) {
                const link = event.target.closest("a[href]");

                if (
                    !link ||
                    event.defaultPrevented ||
                    event.button !== 0 ||
                    event.metaKey ||
                    event.ctrlKey ||
                    event.shiftKey ||
                    event.altKey ||
                    link.target === "_blank" ||
                    link.hasAttribute("download")
                ) {
                    return;
                }

                const href = link.getAttribute("href");

                if (
                    !href ||
                    href.startsWith("#") ||
                    href.startsWith("mailto:") ||
                    href.startsWith("tel:") ||
                    href.startsWith("javascript:")
                ) {
                    return;
                }

                let destination;

                try {
                    destination = new URL(href, window.location.href);
                } catch (error) {
                    return;
                }

                const isLocalFile = destination.protocol === "file:";
                const isSameWebsite =
                    destination.origin === window.location.origin;

                if (!isLocalFile && !isSameWebsite) {
                    return;
                }

                if (destination.href === window.location.href) {
                    return;
                }

                event.preventDefault();

                if (navigationStarted) {
                    return;
                }

                navigationStarted = true;
                root.classList.add("page-leaving");

                window.setTimeout(function () {
                    window.location.href = destination.href;
                }, 225);
            });
        }());
    </script>
</body>
</html>
